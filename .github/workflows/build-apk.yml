name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d ' \t\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK asset
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK was not generated."
            exit 1
          fi
          cp "$APK_PATH" ChattingApp.apk
          ls -lh ChattingApp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChattingApp-APK
          path: ChattingApp.apk
          if-no-files-found: error

      - name: Publish direct APK download under GitHub Releases
        id: publish_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: Chatting App APK
          body: "Latest Android APK build ready to download and install on Android."
          files: ChattingApp.apk
          target_commitish: ${{ github.sha }}
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write download summary
        if: always()
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "### ChattingApp.apk is ready" >> "$GITHUB_STEP_SUMMARY"
            echo "Download directly from **Releases**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/latest-apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK built and saved as Actions Artifact" >> "$GITHUB_STEP_SUMMARY"
            echo "Download **ChattingApp-APK** from the **Artifacts** section on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
            echo "To also publish under **Releases**, enable **Read and write permissions** in **Settings -> Actions -> General -> Workflow permissions** and re-run this job." >> "$GITHUB_STEP_SUMMARY"
          fi
